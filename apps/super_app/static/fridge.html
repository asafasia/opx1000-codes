<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Fridge Monitor · Quantum Coherence Lab</title>
    <link rel="stylesheet" href="/lab-tabs.css?v=5">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f3f4f5; }
      body { display: flex; flex-direction: column; }
      .lab-tabs-shell { flex: 0 0 auto; }
      .fridge-frame { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #f3f4f5; }
      .fridge-notice { position: fixed; right: 18px; bottom: 16px; z-index: 3; padding: 8px 11px; border: 1px solid #d7dadd; border-radius: 4px; color: #5d6468; background: rgba(255,255,255,.94); font: 600 .66rem/1.2 ui-monospace, Consolas, monospace; }
    </style>
  </head>
  <body data-lab-tab="fridge-monitor">
    <script src="/lab-tabs.js?v=4"></script>
    <iframe class="fridge-frame" id="fridgeFrame" title="Live fridge temperature monitor"></iframe>
    <div class="fridge-notice" id="fridgeNotice">Connecting to fridge monitor…</div>
    <script>
      const frame = document.querySelector("#fridgeFrame");
      const notice = document.querySelector("#fridgeNotice");
      frame.src = `${window.location.protocol}//${window.location.hostname || "127.0.0.1"}:8765/`;
      frame.addEventListener("load", () => { notice.hidden = true; });
    </script>
  </body>
</html>
